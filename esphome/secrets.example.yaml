# Copy to secrets.yaml (next to the device YAML, or merge into your ESPHome secrets) and fill in your values.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
# 32-byte base64 key, e.g. from https://esphome.io/components/api.html (or let the ESPHome dashboard generate one)
dehumidifier_api_key: "REPLACE_WITH_BASE64_KEY"
dehumidifier_ota_password: "choose-a-password"
dehumidifier_ap_password: "choose-a-password"
