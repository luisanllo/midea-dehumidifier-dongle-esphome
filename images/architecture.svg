<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Fully local control — no Midea cloud, no extra hardware</text>

  <!-- Dehumidifier -->
  <rect x="40" y="90" width="230" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="70" y="112" width="170" height="40" rx="8" fill="#334155"/>
  <text x="155" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80" font-family="ui-monospace,Consolas,monospace">52 %</text>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="80" y1="172" x2="230" y2="172"/><line x1="80" y1="186" x2="230" y2="186"/><line x1="80" y1="200" x2="230" y2="200"/>
  </g>
  <text x="155" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Dehumidifier MCU</text>
  <text x="155" y="260" text-anchor="middle" font-size="14" fill="#475569">MDDFR-20DEN7-QA3-W</text>

  <!-- Link 1 -->
  <line x1="275" y1="185" x2="365" y2="185" stroke="#475569" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="320" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">USB-A port</text>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#475569">UART 9600 baud</text>
  <text x="320" y="226" text-anchor="middle" font-size="12" fill="#475569">5 V logic</text>

  <!-- Dongle -->
  <rect x="370" y="90" width="260" height="190" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="395" y="118" width="60" height="44" rx="6" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="455" y="112" width="150" height="56" rx="6" fill="#15803d"/>
  <rect x="510" y="124" width="34" height="32" rx="3" fill="#0f172a"/>
  <text x="500" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Stock Midea Wi-Fi dongle</text>
  <text x="500" y="224" text-anchor="middle" font-size="14" fill="#475569">Realtek RTL8720CF</text>
  <rect x="425" y="238" width="150" height="28" rx="14" fill="#dcfce7"/>
  <text x="500" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">running ESPHome</text>

  <!-- Link 2 -->
  <line x1="635" y1="185" x2="725" y2="185" stroke="#475569" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M668,160 a14,14 0 0,1 24,0 M662,152 a22,22 0 0,1 36,0" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <text x="680" y="212" text-anchor="middle" font-size="12" fill="#475569">Wi-Fi (LAN)</text>
  <text x="680" y="228" text-anchor="middle" font-size="12" fill="#475569">native API</text>

  <!-- Home Assistant -->
  <rect x="730" y="90" width="230" height="190" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <path d="M845,112 L800,152 L810,152 L810,192 L880,192 L880,152 L890,152 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="845" cy="164" r="7" fill="#0284c7"/>
  <text x="845" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Home Assistant</text>
  <text x="845" y="256" text-anchor="middle" font-size="14" fill="#475569">climate + sensors</text>

  <!-- Cloud crossed -->
  <g transform="translate(500,316)">
    <path d="M-38,10 a16,16 0 0,1 4,-30 a22,22 0 0,1 40,-6 a16,16 0 0,1 26,14 a14,14 0 0,1 -4,22 z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-44" y1="-26" x2="38" y2="14" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="52" y="2" font-size="14" font-weight="600" fill="#dc2626">Midea cloud not needed</text>
  </g>
</svg>
