<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="300" rx="18" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">From stock dongle to ESPHome in five steps</text>

  <g font-size="14" text-anchor="middle">
    <!-- 1 -->
    <rect x="25" y="70" width="170" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="110" cy="105" r="20" fill="#0f172a"/><text x="110" y="111" fill="#fff" font-weight="700" font-size="17">1</text>
    <text x="110" y="150" font-weight="700" fill="#0f172a">Build</text>
    <text x="110" y="176" fill="#475569">Compile the YAML</text>
    <text x="110" y="196" fill="#475569">in ESPHome and</text>
    <text x="110" y="216" fill="#475569">download the .uf2</text>

    <line x1="198" y1="170" x2="218" y2="170" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
    <!-- 2 -->
    <rect x="222" y="70" width="170" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="307" cy="105" r="20" fill="#f59e0b"/><text x="307" y="111" fill="#fff" font-weight="700" font-size="17">2</text>
    <text x="307" y="150" font-weight="700" fill="#0f172a">Download mode</text>
    <text x="307" y="176" fill="#475569">Wire the pads,</text>
    <text x="307" y="196" fill="#475569">CLK to 3.3 V, then</text>
    <text x="307" y="216" fill="#475569">plug the adapter in</text>

    <line x1="395" y1="170" x2="415" y2="170" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
    <!-- 3 -->
    <rect x="419" y="70" width="170" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <circle cx="504" cy="105" r="20" fill="#16a34a"/><text x="504" y="111" fill="#fff" font-weight="700" font-size="17">3</text>
    <text x="504" y="150" font-weight="700" fill="#0f172a">Flash</text>
    <text x="504" y="176" fill="#475569">web.esphome.io/?rtl</text>
    <text x="504" y="196" fill="#475569">in Chrome or Edge:</text>
    <text x="504" y="216" fill="#475569">writes and verifies</text>

    <line x1="592" y1="170" x2="612" y2="170" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
    <!-- 4 -->
    <rect x="616" y="70" width="170" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="701" cy="105" r="20" fill="#0f172a"/><text x="701" y="111" fill="#fff" font-weight="700" font-size="17">4</text>
    <text x="701" y="150" font-weight="700" fill="#0f172a">Unwire</text>
    <text x="701" y="176" fill="#475569">Remove CLK and</text>
    <text x="701" y="196" fill="#475569">all wires from</text>
    <text x="701" y="216" fill="#475569">the dongle</text>

    <line x1="789" y1="170" x2="809" y2="170" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
    <!-- 5 -->
    <rect x="813" y="70" width="162" height="200" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
    <circle cx="894" cy="105" r="20" fill="#0ea5e9"/><text x="894" y="111" fill="#fff" font-weight="700" font-size="17">5</text>
    <text x="894" y="150" font-weight="700" fill="#0f172a">Plug it back</text>
    <text x="894" y="176" fill="#475569">into the running</text>
    <text x="894" y="196" fill="#475569">dehumidifier. Next</text>
    <text x="894" y="216" fill="#475569">updates go over Wi-Fi</text>
  </g>
</svg>
