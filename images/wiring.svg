<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="1000" height="520" rx="18" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Wiring for the first flash (one-time)</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#475569">3.3 V USB-serial adapter (e.g. FT232RL) ↔ dongle bottom pads. The dongle is NOT plugged into anything else.</text>

  <!-- Adapter -->
  <rect x="50" y="110" width="300" height="300" rx="14" fill="#1e3a8a" stroke="#1e40af" stroke-width="2"/>
  <rect x="20" y="215" width="40" height="80" rx="6" fill="#cbd5e1" stroke="#64748b"/>
  <text x="200" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">USB-serial adapter</text>
  <text x="200" y="168" text-anchor="middle" font-size="13" fill="#bfdbfe">to the PC</text>
  <!-- jumper header -->
  <g font-size="13" fill="#e0e7ff">
    <rect x="120" y="190" width="160" height="70" rx="8" fill="#172554"/>
    <circle cx="150" cy="215" r="8" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <circle cx="200" cy="215" r="8" fill="#fbbf24"/>
    <circle cx="250" cy="215" r="8" fill="#fbbf24"/>
    <rect x="190" y="205" width="70" height="20" rx="4" fill="none" stroke="#fde68a" stroke-width="3"/>
    <text x="150" y="246" text-anchor="middle" font-weight="700">5V</text>
    <text x="200" y="246" text-anchor="middle">VCC</text>
    <text x="250" y="246" text-anchor="middle">3V3</text>
  </g>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#fde68a">jumper on VCC–3V3 (3.3 V logic!)</text>
  <!-- header pins -->
  <g font-size="14" fill="#ffffff" font-weight="700">
    <circle cx="330" cy="310" r="9" fill="#111827" stroke="#fff" stroke-width="2"/><text x="310" y="315" text-anchor="end">GND</text>
    <circle cx="330" cy="340" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="310" y="345" text-anchor="end">VCC (3.3 V)</text>
    <circle cx="330" cy="370" r="9" fill="#22c55e" stroke="#fff" stroke-width="2"/><text x="310" y="375" text-anchor="end">TX</text>
    <circle cx="330" cy="400" r="9" fill="#3b82f6" stroke="#fff" stroke-width="2"/><text x="310" y="405" text-anchor="end">RX</text>
  </g>

  <!-- Dongle pads -->
  <rect x="650" y="110" width="300" height="300" rx="14" fill="#166b36" stroke="#0f5a2b" stroke-width="2"/>
  <text x="800" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Dongle (bottom pads)</text>
  <g font-size="14" fill="#ffffff" font-weight="700">
    <circle cx="670" cy="215" r="9" fill="#ef4444" stroke="#fff" stroke-width="2"/><text x="690" y="220">5V</text>
    <circle cx="670" cy="310" r="9" fill="#111827" stroke="#fff" stroke-width="2"/><text x="690" y="315">GND</text>
    <circle cx="670" cy="340" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="690" y="345">CLK (A0)</text>
    <circle cx="670" cy="370" r="9" fill="#22c55e" stroke="#fff" stroke-width="2"/><text x="690" y="375">LOG_RX</text>
    <circle cx="670" cy="400" r="9" fill="#3b82f6" stroke="#fff" stroke-width="2"/><text x="690" y="405">LOG_TX</text>
  </g>

  <!-- Wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M150,207 C150,170 420,150 520,190 S620,215 661,215" stroke="#ef4444"/>
    <path d="M339,310 L661,310" stroke="#111827"/>
    <path d="M339,340 L661,340" stroke="#f59e0b"/>
    <path d="M339,370 L661,370" stroke="#22c55e"/>
    <path d="M339,400 L661,400" stroke="#3b82f6"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">
    <text x="505" y="146">5 V from the free pin of the jumper header</text>
    <text x="500" y="314">ground</text>
    <text x="500" y="344">CLK at 3.3 V while powering up ⇒ download mode</text>
    <text x="500" y="374">adapter TX → LOG_RX</text>
    <text x="500" y="404">LOG_TX → adapter RX</text>
  </g>

  <!-- Notes -->
  <rect x="50" y="430" width="900" height="72" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="70" y="458" font-size="14" fill="#78350f"><tspan font-weight="700">Power the dongle from the adapter, not from a PC USB port.</tspan> A PC pulls the USB data lines (and so the</text>
  <text x="70" y="480" font-size="14" fill="#78350f">chip's A13 pin) low and the chip will not boot reliably. To power-cycle, just unplug and replug the adapter.</text>
</svg>
